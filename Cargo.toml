[package]
name = "derive_display"
authors = ["orgrinrt", "Hiisi Digital"]
version = "0.0.5"
edition = "2021"
# 1.70 builds this crate's own code, and quote 1.0.47 does not, so 1.71 is where a
# fresh resolve actually works. Verified by building under 1.71.0.
rust-version = "1.71"
description = """
An attribute to derive a `Display` implementation from another trait implementation, currently `ToTokens`.
"""
license = "MPL-2.0"
readme = "README.md"
keywords = ["derive", "trait", "impl", "display", "helper"]
categories = ["rust-patterns", "value-formatting", "development-tools", "development-tools::procedural-macro-helpers"]
documentation = "https://docs.rs/derive_display"
homepage = "https://github.com/orgrinrt/derive_display"
repository = "https://github.com/orgrinrt/derive_display"

[lib]
proc-macro = true

[dev-dependencies]
trybuild = "1.0"

[dependencies]
include_proc_macro = "2.0"
syn = { version = "2.0.68", default-features = false, features = ["full", "parsing", "proc-macro", "printing"] }
quote = "1.0.36"
proc-macro2 = { version = "1.0.86", features = [] }

[features]
default = []
# Inert, and that is the point rather than an oversight. The generated impl declares `alloc`
# itself inside a `const _: () = { .. }`, so one expansion resolves in a `#![no_std]` consumer
# and a plain one alike and there is nothing left for a feature to select.
#
# It stays so a consumer can say what it is and have the claim checked, and
# `tests/feature_matrix.rs` compiles a real consumer under it. It is additive: turning it on
# changes nothing anybody else can observe, which is what a cargo feature has to be, since
# features unify across a dependency graph. An earlier version selected the emitted path, so
# one sibling enabling it broke unrelated crates that never named it.
#
# This crate itself is a proc macro and is always `std`. It runs on the host inside the
# compiler, where syn, quote and proc-macro2 all use `std`.
no_std = []
# Implies `no_std`, and governs this crate's own surface, which is empty.
#
# What the attribute generates still allocates, and cannot stop: `ToTokens::to_token_stream`
# materialises a `TokenStream`, and `Display` has to have the text before it can pad it to
# a width. That is a property of the trait being derived from rather than of this crate, and
# the feature says so here rather than implying otherwise by existing quietly.
no_alloc = ["no_std"]
